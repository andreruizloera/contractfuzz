[project]
name = "contractfuzz"
version = "0.1.0"
description = "Find undocumented assumptions in API clients."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andre Ruiz Loera", email = "andre.x.ruizloera@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]
keywords = ["openapi", "fuzzing", "api-testing", "property-testing", "fixtures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# The pytest plugin is the only part that needs pytest at runtime.
pytest = ["pytest>=8.0"]
# The response mocking helpers. Install the one that matches your HTTP
# client: respx mocks httpx, responses mocks requests. Neither is needed by
# anything else in contractfuzz.
mock = ["respx>=0.21", "responses>=0.25"]

[project.urls]
Repository = "https://github.com/andreruizloera/contractfuzz"

[project.scripts]
contractfuzz = "contractfuzz.cli:main"

[project.entry-points.pytest11]
contractfuzz = "contractfuzz.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    # Both mocking backends plus the HTTP clients they mock, so the test
    # suite and examples/test_mocked_client.py exercise the real libraries.
    "respx>=0.21",
    "responses>=0.25",
    "httpx>=0.27",
    "requests>=2.31",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytester` runs pytest inside pytest, which is how tests/test_plugin.py
# exercises the plugin the way a real user's suite would load it.
addopts = "-q -p pytester"
